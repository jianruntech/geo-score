<h1>小さなお店のための会計ソフト</h1>
<p>ソラノ会計は、工房や小さなお店のための会計ソフトです。毎朝銀行の明細を取り込み、入金を請求書と自動で照らし合わせるので、月末の締め作業が数日から半日に短くなります。</p>
<h2>どんなことができますか？</h2>
<p>銀行口座とクレジットカードの明細を毎日取り込みます。照合できなかった取引だけを一覧にして知らせるので、人が判断すべきものだけに時間を使えます。</p>
<p>導入した店舗は1,240店を超え、そのうち38%が月末の締めを一日で終えています。料金は月額980円からです。</p>
