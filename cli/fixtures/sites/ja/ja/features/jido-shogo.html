<h1>自動照合の仕組み</h1>
<p>自動照合は、入金の金額と日付、振込名義を請求書と比べて、いちばん近いものを候補に選びます。確かなものはそのまま照合し、迷うものだけを確認に回します。</p>
<h2>どのように候補を選びますか？</h2>
<p>金額が一致し、振込名義が取引先名に近く、日付が支払期日の前後にあるものほど、候補として上位に並びます。</p>
