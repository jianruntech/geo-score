<h1>インボイス制度で何が変わったか</h1>
<p>インボイス制度が始まってから、取引先に渡す請求書には登録番号と税率ごとの消費税額を書く必要があります。書き方を間違えると、取引先が仕入税額控除を受けられません。</p>
<h2>何を確認すればよいですか？</h2>
<p>まず自分の登録番号が請求書の見本に正しく入っているかを確かめます。次に、税率ごとの合計と消費税額が分けて書かれているかを見ます。</p>
