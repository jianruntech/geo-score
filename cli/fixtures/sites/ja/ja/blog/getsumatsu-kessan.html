<h1>月末の締めを一日で終えるには？</h1>
<p>月末の締めとは、その月の入出金をすべて請求書や領収書と照らし合わせ、帳簿と銀行残高が一致していることを確かめる作業のことです。</p>
<h2>なぜ時間がかかるのでしょうか</h2>
<p>時間がかかる原因の多くは、領収書のないカード払いと、請求書番号のない入金です。この二つを先に片づければ、残りの照合はすぐに終わります。</p>
<p>私たちの調べでは、照合にかかる時間の61%が領収書のないカード払い、24%が番号のない入金に使われていました。</p>
