<h1>請求書の漏れはなぜ起きるのか</h1>
<p>請求書の漏れは、作業が終わった日と請求書を出す日が離れているときに起きやすくなります。忙しい週ほど、後で出すつもりの請求書が忘れられてしまいます。</p>
<h2>漏れを防ぐにはどうすればよいですか？</h2>
<p>作業が終わったその日のうちに請求書の下書きを作っておくと、漏れはほとんどなくなります。下書きは後から金額を直すこともできます。</p>
