<h1>請求書を取り込む</h1>
<p>紙の請求書はスマートフォンで撮影し、電子の請求書はファイルのままアップロードします。取り込んだ請求書は、金額と日付を読み取ってから一覧に並びます。</p>
<h2>読み取りを直すには？</h2>
<p>読み取った金額や日付が違っているときは、一覧の行を開いてその場で直せます。直した内容は次回からの読み取りにも使われます。</p>
