<h1>銀行口座を連携するには</h1>
<p>設定画面の「口座」から銀行を選び、銀行のログイン画面で連携を許可します。連携が終わると、過去九十日分の明細が自動で取り込まれます。</p>
<h2>どの銀行に対応していますか？</h2>
<p>主な都市銀行と地方銀行、ネット銀行に対応しています。対応していない銀行の明細は、ファイルをアップロードして取り込むことができます。</p>
