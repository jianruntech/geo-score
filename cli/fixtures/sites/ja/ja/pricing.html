<h1>料金プランの選び方</h1>
<p>ソラノ会計の料金は、取引の件数や利用者の人数にかかわらず、事業者ごとの月額定額です。どのプランにも銀行連携と請求書の作成が含まれています。</p>
<h2>どのプランが合っていますか？</h2>
<p>一人で営むお店にはベーシック、数人で回す工房にはスタンダードがおすすめです。従業員の給与計算が必要ならプロをお選びください。</p>
