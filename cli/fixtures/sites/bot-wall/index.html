<h1>把库存交给离客户最近的仓</h1>
<p>松塔云仓为中小电商卖家提供按件计费的共享仓储服务。你把货发到离客户最近的仓库，我们负责上架、拣货、打包和发货，订单在下午四点前付款即可当天出库，不需要自己租仓库，也不需要自己招人打包。</p>
<h2>松塔云仓提供什么服务</h2>
<ul><li>按件计费的仓储空间。</li><li>当天拣货打包发货。</li><li>退货质检和重新上架。</li></ul>
<h2>怎么开始入仓</h2>
<p>在后台创建入库单，打印箱唛贴在每一箱货上，按预约时间送到仓库，清点上架之后就可以开始接单发货。</p>
