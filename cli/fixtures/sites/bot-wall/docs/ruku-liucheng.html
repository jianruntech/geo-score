<h1>入库流程是怎样的</h1>
<p>入库流程从创建入库单开始，到商品清点上架结束。整个过程通常在货物送达后一个工作日内完成，上架完成后系统会通知你，可售库存也会同步更新到你的店铺后台。</p>
<h2>入库前要准备什么</h2>
<ul><li>在后台创建入库单。</li><li>打印箱唛并贴在每一箱上。</li><li>预约送货时间。</li></ul>
<h2>清点有差异怎么办</h2>
<p>如果清点数量和入库单不一致，仓库会拍照记录并通知你确认，确认之后按实际数量上架。</p>
