<h1>松塔云仓怎么收费</h1>
<p>松塔云仓按实际使用收费，没有最低消费和年费。存储费按每立方米每天计算，操作费按每单件数计算，快递费按合作快递的协议价结算，所有费用都在后台逐笔列明，月底统一出账单。</p>
<h2>收费包括哪些项目</h2>
<ul><li>存储费。</li><li>拣货打包操作费。</li><li>快递运费。</li></ul>
<h2>有没有隐藏费用</h2>
<p>没有。增值服务比如贴标、组套和礼品包装都会在下单前报价，确认之后才会执行。</p>
