<h1>怎么连接银行账户</h1>
<p>连接银行账户后，青梧记账会获得一份只读的交易流水，每天早上自动刷新。青梧记账永远无法动用你的资金，你也可以随时在网银里撤销授权，不需要联系我们。</p>
<h2>连接之前需要准备什么</h2>
<ul>
<li>确认可以登录企业网银。</li>
<li>准备好用于授权确认的手机。</li>
<li>想清楚哪些账户属于公司。</li>
</ul>
<h2>连接是如何完成的</h2>
<p>在设置里选择银行流水，从列表中找到你的开户行，然后在网银里确认授权即可。第一次同步会导入最近九十天的交易。</p>
