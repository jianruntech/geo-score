<h1>如何导入发票</h1>
<p>如果你在使用青梧记账之前用表格记录发票，可以一次性上传导入。每一行会变成一张发票，包含客户、日期、金额和状态，已付款的发票会自动和银行流水配对。</p>
<h2>模板需要哪些字段</h2>
<ul>
<li>每行一张发票，发票号不能重复。</li>
<li>日期按年月日填写。</li>
<li>金额为含税金额，不带货币符号。</li>
</ul>
<h2>上传时会检查什么</h2>
<p>导入之前系统会逐行检查，把无法识别的行列出来，你修改之后再次上传即可，已经成功的行不会重复导入。</p>
