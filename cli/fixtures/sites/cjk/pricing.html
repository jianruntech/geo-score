<h1>青梧记账怎么定价</h1>
<p>青梧记账按公司收取固定月费，不限交易笔数、发票数量和使用人数。所有套餐都包含银行流水同步和增值税申报数据，更高的套餐增加了工资核算和多币种账户，适合做外贸的工作室。</p>
<h2>哪个套餐适合你</h2>
<table>
<tr><th>套餐</th><th>月费</th><th>适合</th></tr>
<tr><td>工作台</td><td>每月六十八元</td><td>个人手艺人</td></tr>
<tr><td>工作室</td><td>每月一百六十八元</td><td>小团队</td></tr>
</table>
<h2>什么费用不包含在内</h2>
<p>价格已含税，没有开通费，可以在任意一个月底取消，取消后数据保留九十天供你导出。</p>
<p>价格更新于2026年7月1日</p>
