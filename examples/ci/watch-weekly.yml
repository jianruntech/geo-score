# Weekly geo-score watch (level 3). Copy to .github/workflows/geo-score-watch.yml in the repo that
# holds geo-score/geo-score-watch.json and geo-score/queries.csv (create them with
# `python3 geo_score.py watch init --dir geo-score …`), and add your keys as repository secrets.
# Engines whose secret is missing are reported as not measured; with no key at all the job exits 3.
# If the config names other variables with key_env, export them below too.
# The commit step stores your questions and the full AI answers in git: use a private repository.
name: geo-score watch
on:
  schedule:
    - cron: "0 1 * * 1"          # Mondays 01:00 UTC. Same weekday every week keeps runs comparable.
  workflow_dispatch:
permissions:
  contents: write                # to commit the run file back
concurrency: geo-score-watch
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The last step pushes the run file back, so this job keeps the checkout's credentials on purpose.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1  # zizmor: ignore[artipacked]
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with: {python-version: "3.12"}
      - name: Fetch geo-score (pinned to a release, checksums verified)
        id: fetch
        run: |
          rel=https://github.com/jianruntech/geo-score/releases/download/v1.7.0
          curl -sSfL -o geo_score.py "$rel/geo_score.py"
          curl -sSfL -o geo_watch.py "$rel/geo_watch.py"
          curl -sSfL -o SHA256SUMS "$rel/SHA256SUMS"
          # each file's line goes to its own file: a SHA256SUMS without one of them stops the step here
          # instead of leaving that file unchecked
          grep ' geo_score\.py$' SHA256SUMS > geo_score.py.sha256
          grep ' geo_watch\.py$' SHA256SUMS > geo_watch.py.sha256
          sha256sum -c geo_score.py.sha256 geo_watch.py.sha256
      - name: Run
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 geo_score.py watch run -c geo-score/geo-score-watch.json -q --format md >> "$GITHUB_STEP_SUMMARY"
      - name: Compare with last week
        # also after a failed run, but never with files that did not pass the checksum step
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        run: python3 geo_score.py watch diff -c geo-score/geo-score-watch.json --format md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Commit the run
        run: |
          git config user.name "geo-score"
          git config user.email "geo-score@users.noreply.github.com"
          git add -f geo-score/.geo-score/watch/runs
          git diff --cached --quiet || git commit -m "chore(geo-score): weekly watch run"
          git push
