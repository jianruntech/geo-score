name: "Tool problem: CLI, Action, MCP server or install"
description: Something does not install, start, run or finish — not a score you think is wrong
title: "[tool] "
labels: ["needs-info"]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste an API key.** geo-score redacts keys from what it stores and prints, but check
        everything you paste here, including configs and environment dumps.

        A score or a check that looks wrong goes in **Wrong score**, and a citation or watch number in
        **Citation check problem**. Many start-up and network problems are already in the
        [troubleshooting guide](https://github.com/jianruntech/geo-score/blob/main/guide/troubleshooting.md)
        and the [MCP troubleshooting section](https://github.com/jianruntech/geo-score/blob/main/guide/mcp.md#troubleshooting).
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options:
        - CLI
        - GitHub Action
        - MCP server
        - Install via pip, pipx or uvx
        - MCPB bundle (Claude Desktop)
        - Claude Code plugin
        - Gemini CLI extension
        - Docker
    validations: { required: true }
  - type: input
    id: tool_version
    attributes:
      label: Tool version
      description: >
        The output of `geo-score --version` (or `python3 geo_score.py --version`). For the MCP server,
        the version the `status` tool reports; for the Action, the ref you use (for example `@v1`).
      placeholder: "geo-score X.Y.Z (rubric vA.B)"
    validations: { required: true }
  - type: input
    id: environment
    attributes:
      label: Operating system and Python version
      placeholder: "macOS 15.5, Python 3.12.4"
  - type: input
    id: client
    attributes:
      label: MCP client or CI runner, with its version
      placeholder: "Claude Desktop, Cursor or VS Code and its version · ubuntu-latest"
  - type: textarea
    id: command
    attributes:
      label: The command or config you used
      description: The command line, the workflow step or the MCP server entry of your client's config, with keys removed.
      render: text
    validations: { required: true }
  - type: textarea
    id: output
    attributes:
      label: Output
      description: What was printed on stderr, the step log, or the output of the MCP `status` tool.
      render: text
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What you expected instead
