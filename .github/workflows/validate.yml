name: validate
on:
  push: {branches: [main]}
  pull_request:
  schedule: [{cron: "0 7 * * 1"}]     # the CLI talks to live sites — catch drift weekly
  workflow_dispatch:
# the gate only reads the repository
permissions: {contents: read}
jobs:
  # v1 moves only when scripts/release.py publishes a release (RELEASING.md), never on a push.
  # One gate, one script: scripts/check.sh is what maintainers run before every merge (hosted Actions
  # has not run on this organisation so far). Running the same script here means the two cannot drift.
  check:
    name: check (python ${{ matrix.py }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: {py: ["3.8", "3.14"]}      # the oldest and the newest stable, as check.sh tests
    steps:
      # actions are pinned by commit; the comment names the release that commit is
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}      # validate.py rule 28 reads the release tags
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: {python-version: "${{ matrix.py }}"}
      # the versions scripts/check.sh pins (RUFF_VERSION, JSONSCHEMA_VERSION)
      - run: pip install --quiet jsonschema==4.23.0 ruff==0.15.15
      - run: bash scripts/check.sh --live
