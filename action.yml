name: "geo-score"
description: "Score a site 0-100 on whether AI answer engines can find, parse, trust and cite it. Fails the build below a threshold."
branding:
  icon: "search"
  color: "green"
inputs:
  url:
    description: "The URL to score."
    required: true
  fail-under:
    description: "Fail the job if the normalised score is below this. Omit to report without failing."
    required: false
  sample:
    description: "How many pages to sample (default 8)."
    required: false
    default: "8"
  json-out:
    description: "Write the machine-readable report (schema/report.v2.json) to this path."
    required: false
  sarif:
    description: "Write SARIF 2.1.0 to this path, for github/codeql-action/upload-sarif or any SARIF viewer."
    required: false
  junit:
    description: "Write JUnit XML to this path, for CI test-report tools."
    required: false
  annotations:
    description: "Annotate the run with checks at zero (gates as errors, others as warnings). Set to false to turn off."
    required: false
    default: "true"
outputs:
  score:
    description: "Normalised score, 0-100."
    value: ${{ steps.run.outputs.score }}
  band:
    description: "Band name: Not started / Early / Growing / Solid / Leading."
    value: ${{ steps.run.outputs.band }}
  gate-capped:
    description: "true when a gate check is at zero and the score is capped."
    value: ${{ steps.run.outputs.gate-capped }}
  report:
    description: "The full report as JSON."
    value: ${{ steps.run.outputs.report }}
  report-path:
    description: "Where the JSON report was written."
    value: ${{ steps.run.outputs.report-path }}
runs:
  using: "composite"
  steps:
    - id: run
      shell: bash
      # inputs arrive as environment variables, never pasted into the script: a url or path
      # containing $(...) or a quote must stay data
      env:
        GEO_URL: ${{ inputs.url }}
        GEO_FAIL_UNDER: ${{ inputs.fail-under }}
        GEO_SAMPLE: ${{ inputs.sample }}
        GEO_JSON_OUT: ${{ inputs.json-out }}
        GEO_SARIF: ${{ inputs.sarif }}
        GEO_JUNIT: ${{ inputs.junit }}
        GEO_ANNOTATIONS: ${{ inputs.annotations }}
        GEO_ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        GEO_URL="${GEO_URL:-}" GEO_FAIL_UNDER="${GEO_FAIL_UNDER:-}" GEO_SAMPLE="${GEO_SAMPLE:-8}"
        GEO_JSON_OUT="${GEO_JSON_OUT:-}" GEO_SARIF="${GEO_SARIF:-}" GEO_JUNIT="${GEO_JUNIT:-}" GEO_ANNOTATIONS="${GEO_ANNOTATIONS:-true}"
        [ -n "$GEO_URL" ] || { echo "::error title=geo-score::the url input is empty"; exit 2; }
        [[ "$GEO_SAMPLE" =~ ^[0-9]+$ ]] || { echo "::error title=geo-score::sample must be a whole number, got '$GEO_SAMPLE'"; exit 2; }
        if [ -n "$GEO_FAIL_UNDER" ] && ! [[ "$GEO_FAIL_UNDER" =~ ^[0-9]+$ ]]; then
          echo "::error title=geo-score::fail-under must be a whole number from 0 to 100, got '$GEO_FAIL_UNDER'"; exit 2
        fi
        OUT="${GEO_JSON_OUT:-${RUNNER_TEMP:-/tmp}/geo-score-report.json}"
        ARGS=(--sample "$GEO_SAMPLE" --explain --json-out "$OUT")
        [ -z "$GEO_SARIF" ] || ARGS+=(--sarif "$GEO_SARIF")
        [ -z "$GEO_JUNIT" ] || ARGS+=(--junit "$GEO_JUNIT")
        # one run: the log, the summary, the annotations and every file describe the same fetch
        if ! python3 "$GEO_ACTION_PATH/cli/geo_score.py" "$GEO_URL" "${ARGS[@]}"; then
          echo "::error title=geo-score::could not score $GEO_URL (see the log above)"; exit 2
        fi
        echo "report-path=$OUT" >> "$GITHUB_OUTPUT"
        python3 "$GEO_ACTION_PATH/action/summary.py" "$OUT" "$GEO_ANNOTATIONS"
        SCORE=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['normalised'])" "$OUT")
        if [ -n "$GEO_FAIL_UNDER" ] && [ "$SCORE" -lt "$GEO_FAIL_UNDER" ]; then
          echo "::error title=geo-score::$SCORE is below the $GEO_FAIL_UNDER threshold"
          exit 1
        fi
